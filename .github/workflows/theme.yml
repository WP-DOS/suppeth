name: Theme checks and ZIP

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "docs/**", "refactor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install development checks
        run: |
          composer validate --strict
          npm ci
          composer install --no-interaction --no-progress
      - name: CSS, PHP and theme validation
        run: npm run lint
      - name: Check source syntax
        run: |
          find patterns scripts tests/fixtures -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l functions.php
          find tests -name '*.browser.js' -print0 | xargs -0 -n1 node --check
      - name: Start the shared WordPress preview
        run: npm run env:setup
      - name: Install test browser
        run: npx --yes agent-browser@0.38.2 install --with-deps
      - name: Packaging safety and WordPress regressions
        run: |
          npm test
          npm run env:check
      - name: Desktop and mobile usability guards
        run: |
          trap 'npx --yes agent-browser@0.38.2 --session suppeth-ci-guards close' EXIT
          npx --yes agent-browser@0.38.2 --session suppeth-ci-guards open http://localhost:8899/typography/
          npx --yes agent-browser@0.38.2 --session suppeth-ci-guards eval --stdin < tests/usability-baseline.browser.js
          npx --yes agent-browser@0.38.2 --session suppeth-ci-guards set viewport 390 844
          npx --yes agent-browser@0.38.2 --session suppeth-ci-guards eval --stdin < tests/usability-baseline.browser.js
      - name: Package theme
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: suppeth-theme
          path: dist/suppeth.zip
          if-no-files-found: error
      - name: Stop preview
        if: always()
        run: npm run env:stop || true
